name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  USE_MOCK_LLM: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        shell: bash
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.lint ? 0 : 1)" && [ -x node_modules/.bin/eslint ]; then
            npm run lint
          else
            echo "No working lint setup found; skipping lint."
          fi

      - name: Build
        run: npm run build
